# Builds Cheo's firmware automatically whenever the code changes.
# It compiles cdbos/cdbos.ino for the ESP32-S3, saves it as cheo-s3.bin,
# and sets version.txt to the FW_VERSION in the code. Cheo then updates himself.
name: Build Cheo firmware

on:
  push:
    branches: [main]
    paths: ['cdbos/**', 'wake/**', '.github/workflows/build.yml']
  pull_request:             # test-compile pull requests (doesn't upload anything)
    paths: ['cdbos/**', 'wake/**', '.github/workflows/build.yml']
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: build-firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 boards and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "ArduinoJson" "NimBLE-Arduino"

      - name: Safety check - no passwords or keys in the code
        run: |
          if grep -E 'const char\* SETUP_(WIFI_SSID|WIFI_PASS|HOTSPOT_SSID|HOTSPOT_PASS|GROQ_KEY) *= *"[^"]+"' cdbos/cdbos.ino; then
            echo "::error::A SETUP_ line has a password or key in it. Blank it (\"\") before pushing."
            exit 1
          fi

      - name: Add the "Hey Cheo" model (if one is in wake/)
        run: |
          Z=$(ls wake/*.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            arduino-cli config set library.enable_unsafe_install true
            arduino-cli lib install --zip-path "$Z"
            H=$(ls ~/Arduino/libraries/*/src/*_inferencing.h | head -1)
            echo "Wake word model: $H"
            printf '#pragma once\n#define EIDSP_QUANTIZE_FILTERBANK 0\n#define EI_CLASSIFIER_SLICES_PER_MODEL_WINDOW 4\n#include <%s>\n' "$(basename "$H")" > cdbos/wake_model.h
            cat cdbos/wake_model.h
          else
            echo "No wake word model in wake/ yet - building without it"
          fi

      - name: Stamp the build number
        run: echo "#define BUILD_NUM ${{ github.run_number }}" > cdbos/build_num.h

      - name: Compile for ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi" \
            --export-binaries --warnings default cdbos
          ls -la cdbos/build/*/

      - name: Update cheo-s3.bin and version.txt
        if: github.event_name != 'pull_request'
        run: |
          VER=$(grep -oP '#define FW_VERSION \K[0-9]+' cdbos/cdbos.ino)
          cp cdbos/build/esp32.esp32.esp32s3/cdbos.ino.bin cheo-s3.bin
          echo $((VER * 1000 + ${{ github.run_number }})) > version.txt   # e.g. 13042 = v13, build 42
          rm -rf cdbos/build cdbos/wake_model.h cdbos/build_num.h
          git config user.name "cheo-builder"
          git config user.email "cheo-builder@users.noreply.github.com"
          git add cheo-s3.bin version.txt
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Build firmware v$VER (cheo-s3.bin)"
          git push
